[project]
name = "kartlab"
version = "0.1.0"
description = "Un kart que aprende a conducir solo con aprendizaje por refuerzo, con render pseudo-3D de 16 bits en CPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jupiutrera" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "gymnasium>=1.4.0",
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
    "pyyaml>=6.0.3",
    "stable-baselines3>=2.9.2",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
]

[project.scripts]
kartlab = "kartlab.show.hub:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

# PyTorch solo CPU en todas las plataformas: sin CUDA, sin nvidia-*, sin triton.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Los worktrees de otros agentes viven en .claude/: no se lintan.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PLW1514"]
# PLW1514 (abrir ficheros sin encoding) está en preview: se activa solo esa regla.
preview = true
explicit-preview-rules = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["smoke: prueba rápida de extremo a extremo del stack (CI)"]
